<section class="profissional-form">
  <a class="profissional-form__back" routerLink="/admin/profissionais">← Profissionais</a>

  @if (loading()) {
    <p class="profissional-form__state">Carregando...</p>
  } @else {
    @if (dataCriacao()) {
      <p class="profissional-form__meta">Cadastrado em {{ dataCriacao() | date: 'dd/MM/yyyy' }}</p>
    }

    <form class="profissional-form__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">Nome</span>
        <input
          class="field__input"
          type="text"
          formControlName="nome"
          [class.field__input--invalid]="mensagemErro(form.controls.nome)"
        />
        @if (mensagemErro(form.controls.nome); as erro) {
          <span class="field__error">{{ erro }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Email</span>
        <input
          class="field__input"
          type="email"
          formControlName="email"
          [class.field__input--invalid]="mensagemErro(form.controls.email)"
        />
        @if (mensagemErro(form.controls.email); as erro) {
          <span class="field__error">{{ erro }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ editando() ? 'Nova senha' : 'Senha' }}</span>
        <input
          class="field__input"
          type="password"
          formControlName="senha"
          autocomplete="new-password"
          [class.field__input--invalid]="mensagemErro(form.controls.senha)"
        />
        @if (mensagemErro(form.controls.senha); as erro) {
          <span class="field__error">{{ erro }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Registro profissional (CREFITO)</span>
        <input
          class="field__input"
          type="text"
          formControlName="registroProfissional"
          [class.field__input--invalid]="mensagemErro(form.controls.registroProfissional)"
        />
        @if (mensagemErro(form.controls.registroProfissional); as erro) {
          <span class="field__error">{{ erro }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Especialidade</span>
        <input
          class="field__input"
          type="text"
          formControlName="especialidade"
          [class.field__input--invalid]="mensagemErro(form.controls.especialidade)"
        />
        @if (mensagemErro(form.controls.especialidade); as erro) {
          <span class="field__error">{{ erro }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Valor da consulta particular (R$)</span>
        <input class="field__input" type="number" step="0.01" min="0" formControlName="valorConsultaParticular" />
      </label>

      <label class="field">
        <span class="field__label">Convênios aceitos (separados por vírgula)</span>
        <input class="field__input" type="text" formControlName="conveniosAceitos" placeholder="Ex: Unimed, Bradesco Saúde" />
      </label>

      <label class="field">
        <span class="field__label">Foto (URL)</span>
        <input class="field__input" type="text" formControlName="foto" placeholder="https://..." />
      </label>

      <label class="field">
        <span class="field__label">Data de nascimento</span>
        <input class="field__input" type="date" formControlName="dataNascimento" />
      </label>

      <label class="field">
        <span class="field__label">Sexo</span>
        <select class="field__input" formControlName="sexo">
          <option value="">Não informado</option>
          <option value="Feminino">Feminino</option>
          <option value="Masculino">Masculino</option>
          <option value="Outro">Outro</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Telefone</span>
        <input class="field__input" type="text" formControlName="telefone" />
      </label>

      @if (errorMessage()) {
        <p class="profissional-form__error">{{ errorMessage() }}</p>
      }

      <button class="profissional-form__submit" type="submit" [disabled]="saving()">
        {{ saving() ? 'Salvando...' : 'Salvar' }}
      </button>

      @if (editando()) {
        <button class="profissional-form__delete" type="button" (click)="excluir()">
          Excluir Profissional
        </button>
      }
    </form>
  }
</section>
