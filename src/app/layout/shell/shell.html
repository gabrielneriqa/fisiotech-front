<div class="shell">
  <header class="shell__header">
    <div class="shell__greeting">
      <p class="shell__greeting-label">Bem-vindo(a),</p>
      <h1 class="shell__greeting-name">{{ currentUser()?.nome }}</h1>
    </div>
    <button class="shell__logout" type="button" (click)="logout()">Sair</button>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>

  <nav class="shell__nav">
    @for (item of navItems(); track item.path) {
      <a class="shell__nav-item" [routerLink]="item.path" routerLinkActive="shell__nav-item--active">
        <app-icon class="shell__nav-icon" [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
