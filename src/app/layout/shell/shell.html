<div class="shell">
  <header class="shell__header">
    <div class="shell__greeting">
      <p class="shell__greeting-label">Bem-vindo(a),</p>
      <h1 class="shell__greeting-name">{{ currentUser()?.nome }}</h1>
    </div>
    <button class="shell__logout" type="button" (click)="logout()">Sair</button>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>

  <nav class="shell__nav">
    <a class="shell__nav-item" routerLink="/home" routerLinkActive="shell__nav-item--active">
      <span class="shell__nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a class="shell__nav-item" routerLink="/pacientes" routerLinkActive="shell__nav-item--active">
      <span class="shell__nav-icon">👥</span>
      <span>Pacientes</span>
    </a>
    <a class="shell__nav-item" routerLink="/consultas" routerLinkActive="shell__nav-item--active">
      <span class="shell__nav-icon">📅</span>
      <span>Consultas</span>
    </a>
  </nav>
</div>
